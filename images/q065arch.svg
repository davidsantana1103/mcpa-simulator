<svg xmlns="http://www.w3.org/2000/svg" width="720" height="530" viewBox="0 0 720 530" font-family="Arial,sans-serif"><defs><marker id="ah" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#555"/></marker></defs><rect width="720" height="530" fill="#ffffff"/><text x="28" y="54" font-size="12" font-weight="bold" fill="#111">Option A</text><rect x="24" y="60" width="312" height="222" rx="7" fill="#fbfdff" stroke="#aabbcc" stroke-width="1"/><rect x="105" y="71" width="150" height="26" rx="5" fill="#eeeeee" stroke="#888888" stroke-width="1.3"/><text x="180" y="87.5" text-anchor="middle" font-size="10" font-weight="normal" fill="#111">v1.5.0  region optional</text><line x1="180" y1="97" x2="180" y2="111" stroke="#555" stroke-width="1.5" marker-end="url(#ah)"/><rect x="95" y="113" width="170" height="28" rx="5" fill="#cfe2ff" stroke="#2a8fd8" stroke-width="1.3"/><text x="180" y="123.5" text-anchor="middle" font-size="10" font-weight="bold" fill="#111">v2.0.0  region required</text><text x="180" y="136" text-anchor="middle" font-size="8.5" fill="#555">requests omitting it now FAIL</text><text x="180" y="172" text-anchor="middle" font-size="8.5" fill="#666">old clients break → breaking change</text><rect x="80" y="194" width="200" height="26" rx="5" fill="#d6f5de" stroke="#3aa655" stroke-width="1.3"/><text x="180" y="210.5" text-anchor="middle" font-size="10" font-weight="bold" fill="#111">MAJOR bump is required</text><text x="392" y="54" font-size="12" font-weight="bold" fill="#111">Option B</text><rect x="388" y="60" width="312" height="222" rx="7" fill="#fbfdff" stroke="#aabbcc" stroke-width="1"/><rect x="469" y="71" width="150" height="26" rx="5" fill="#eeeeee" stroke="#888888" stroke-width="1.3"/><text x="544" y="87.5" text-anchor="middle" font-size="10" font-weight="normal" fill="#111">v1.5.0  region optional</text><line x1="544" y1="97" x2="544" y2="111" stroke="#555" stroke-width="1.5" marker-end="url(#ah)"/><rect x="459" y="113" width="170" height="28" rx="5" fill="#ffe8c7" stroke="#c77b2a" stroke-width="1.3"/><text x="544" y="123.5" text-anchor="middle" font-size="10" font-weight="bold" fill="#111">v1.6.0  region required</text><text x="544" y="136" text-anchor="middle" font-size="8.5" fill="#555">as a MINOR bump</text><text x="544" y="172" text-anchor="middle" font-size="8.5" fill="#666">omitting clients still break —</text><text x="544" y="187" text-anchor="middle" font-size="8.5" fill="#666">a minor bump hides the break</text><text x="28" y="294" font-size="12" font-weight="bold" fill="#111">Option C</text><rect x="24" y="300" width="312" height="222" rx="7" fill="#fbfdff" stroke="#aabbcc" stroke-width="1"/><rect x="105" y="311" width="150" height="26" rx="5" fill="#eeeeee" stroke="#888888" stroke-width="1.3"/><text x="180" y="327.5" text-anchor="middle" font-size="10" font-weight="normal" fill="#111">v1.5.0  region optional</text><line x1="180" y1="337" x2="180" y2="351" stroke="#555" stroke-width="1.5" marker-end="url(#ah)"/><rect x="95" y="353" width="170" height="28" rx="5" fill="#ffe8c7" stroke="#c77b2a" stroke-width="1.3"/><text x="180" y="363.5" text-anchor="middle" font-size="10" font-weight="bold" fill="#111">v1.5.1  region required</text><text x="180" y="376" text-anchor="middle" font-size="8.5" fill="#555">as a PATCH bump</text><text x="180" y="412" text-anchor="middle" font-size="8.5" fill="#666">patches are for fixes only,</text><text x="180" y="427" text-anchor="middle" font-size="8.5" fill="#666">never semantic changes</text><text x="392" y="294" font-size="12" font-weight="bold" fill="#111">Option D</text><rect x="388" y="300" width="312" height="222" rx="7" fill="#fbfdff" stroke="#aabbcc" stroke-width="1"/><rect x="469" y="311" width="150" height="26" rx="5" fill="#eeeeee" stroke="#888888" stroke-width="1.3"/><text x="544" y="327.5" text-anchor="middle" font-size="10" font-weight="normal" fill="#111">v1.5.0  region optional</text><line x1="544" y1="337" x2="544" y2="351" stroke="#555" stroke-width="1.5" marker-end="url(#ah)"/><rect x="459" y="353" width="170" height="28" rx="5" fill="#ffe8c7" stroke="#c77b2a" stroke-width="1.3"/><text x="544" y="363.5" text-anchor="middle" font-size="10" font-weight="bold" fill="#111">v1.5.0  region required</text><text x="544" y="376" text-anchor="middle" font-size="8.5" fill="#555">version UNCHANGED</text><text x="544" y="412" text-anchor="middle" font-size="8.5" fill="#666">silent contract drift:</text><text x="544" y="427" text-anchor="middle" font-size="8.5" fill="#666">clients discover it in production</text></svg>