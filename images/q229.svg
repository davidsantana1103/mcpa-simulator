<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" font-family="Arial,sans-serif" font-size="12">
<rect width="680" height="400" fill="#fff"/>
<defs>
  <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2a8fd8"/></marker>
  <marker id="lb-r" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#e8913a"/></marker>
  <marker id="lb-l" markerWidth="6" markerHeight="6" refX="0" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#e8913a"/></marker>
</defs>
<!-- Runtime Fabric -->
<rect x="15" y="150" width="480" height="235" rx="8" fill="#2a8fd8"/>
<text x="255" y="378" text-anchor="middle" fill="#fff" font-weight="bold" font-size="14">RUNTIME FABRIC</text>

<!-- Load Balancer -->
<rect x="220" y="55" width="75" height="28" fill="#e8913a" rx="3"/>
<text x="257" y="73" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">LOAD BALANCER</text>
<!-- Load Balancer L/R start/end markers -->
<line x1="200" y1="69" x2="220" y2="69" stroke="#e8913a" stroke-width="2" marker-end="url(#lb-r)"/>
<line x1="295" y1="69" x2="315" y2="69" stroke="#e8913a" stroke-width="2" marker-end="url(#lb-l)"/>
<text x="145" y="74" font-size="9" fill="#555">L (start)</text>
<text x="320" y="74" font-size="9" fill="#555">R (end)</text>
<!-- Incoming HTTP -->
<line x1="295" y1="69" x2="420" y2="69" stroke="#2a8fd8" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
<text x="425" y="62" font-size="9" fill="#555" font-weight="bold">HTTP / HTTPS</text>

<!-- Management Plane -->
<rect x="65" y="108" width="395" height="28" rx="8" fill="#e8913a"/>
<text x="262" y="127" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">EKS / AKS / GKE Management Plane</text>

<!-- Ingress sections -->
<rect x="30" y="165" width="110" height="18" fill="#e8913a" rx="2"/>
<text x="85" y="178" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Ingress</text>
<rect x="190" y="165" width="110" height="18" fill="#e8913a" rx="2"/>
<text x="245" y="178" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Ingress</text>
<rect x="350" y="165" width="110" height="18" fill="#e8913a" rx="2"/>
<text x="405" y="178" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Ingress</text>

