<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" font-family="Arial,sans-serif">
<defs><marker id="ah" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#555"/></marker></defs>
<text x="30" y="36" text-anchor="start" font-size="11" fill="#111" font-weight="bold">Option A</text><rect x="25" y="44" width="310" height="192" rx="6" fill="#fafcff" stroke="#8899aa" stroke-width="1.2"/><text x="175" y="56" text-anchor="middle" font-size="9" fill="#111" font-weight="normal">GET /catalog</text><rect x="115" y="60" width="120" height="20" rx="4" fill="#e8f0ff" stroke="#555" stroke-width="1.2"/><text x="175" y="90" text-anchor="middle" font-size="10" fill="#111" font-weight="bold">TTL-bounded cache</text><rect x="90" y="84" width="170" height="22" rx="4" fill="#d6f5de" stroke="#3aa655" stroke-width="1.2"/><text x="175" y="124" text-anchor="middle" font-size="9" fill="#111" font-weight="normal">System API</text><rect x="125" y="118" width="100" height="20" rx="4" fill="#cfe2ff" stroke="#2a8fd8" stroke-width="1.2"/><text x="175" y="152" text-anchor="middle" font-size="9" fill="#666" font-weight="normal">freshness matches the</text><text x="175" y="166" text-anchor="middle" font-size="9" fill="#666" font-weight="normal">data's update rate;</text><text x="175" y="190" text-anchor="middle" font-size="9" fill="#666" font-weight="normal">repeated reads hit</text><text x="175" y="204" text-anchor="middle" font-size="9" fill="#666" font-weight="normal">the cache</text><text x="390" y="36" text-anchor="start" font-size="11" fill="#111" font-weight="bold">Option B</text><rect x="385" y="44" width="310" height="192" rx="6" fill="#fafcff" stroke="#8899aa" stroke-width="1.2"/><text x="535" y="56" text-anchor="middle" font-size="9" fill="#111" font-weight="normal">OS stores every</text><rect x="470" y="60" width="130" height="20" rx="4" fill="#ffe8c7" stroke="#c77b2a" stroke-width="1.2"/><text x="535" y="90" text-anchor="middle" font-size="9" fill="#666" font-weight="normal">request, permanently</text><text x="535" y="114" text-anchor="middle" font-size="9" fill="#666" font-weight="normal">audit persistence is</text><text x="535" y="128" text-anchor="middle" font-size="9" fill="#666" font-weight="normal">not a latency fix</text><text x="30" y="286" text-anchor="start" font-size="11" fill="#111" font-weight="bold">Option C</text><rect x="25" y="294" width="310" height="192" rx="6" fill="#fafcff" stroke="#8899aa" stroke-width="1.2"/><text x="175" y="316" text-anchor="middle" font-size="9" fill="#111" font-weight="normal">no caching;</text><rect x="125" y="320" width="100" height="20" rx="4" fill="#eeeeee" stroke="#555" stroke-width="1.2"/><text x="175" y="350" text-anchor="middle" font-size="9" fill="#666" font-weight="normal">backend queried</text><text x="175" y="364" text-anchor="middle" font-size="9" fill="#666" font-weight="normal">every time</text><text x="390" y="286" text-anchor="start" font-size="11" fill="#111" font-weight="bold">Option D</text><rect x="385" y="294" width="310" height="192" rx="6" fill="#fafcff" stroke="#8899aa" stroke-width="1.2"/><text x="535" y="316" text-anchor="middle" font-size="9" fill="#111" font-weight="normal">email nightly</text><rect x="490" y="320" width="90" height="20" rx="4" fill="#cfe2ff" stroke="#2a8fd8" stroke-width="1.2"/><text x="535" y="350" text-anchor="middle" font-size="9" fill="#666" font-weight="normal">exports to clients</text><text x="535" y="374" text-anchor="middle" font-size="9" fill="#666" font-weight="normal">email is not an</text><text x="535" y="388" text-anchor="middle" font-size="9" fill="#666" font-weight="normal">API</text></svg>
