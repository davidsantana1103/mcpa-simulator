<svg xmlns="http://www.w3.org/2000/svg" width="720" height="530" viewBox="0 0 720 530" font-family="Arial,sans-serif"><defs><marker id="ah" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#555"/></marker></defs><rect width="720" height="530" fill="#ffffff"/><text x="28" y="54" font-size="12" font-weight="bold" fill="#111">Option A</text><rect x="24" y="60" width="312" height="222" rx="7" fill="#fbfdff" stroke="#aabbcc" stroke-width="1"/><rect x="115" y="72" width="130" height="24" rx="5" fill="#e8f0ff" stroke="#667788" stroke-width="1.3"/><text x="180" y="87.5" text-anchor="middle" font-size="10" font-weight="normal" fill="#111">GET /catalog</text><line x1="180" y1="96" x2="180" y2="112" stroke="#555" stroke-width="1.5" marker-end="url(#ah)"/><rect x="90" y="116" width="180" height="28" rx="5" fill="#d6f5de" stroke="#3aa655" stroke-width="1.3"/><text x="180" y="126.5" text-anchor="middle" font-size="10" font-weight="bold" fill="#111">TTL-BOUNDED CACHE</text><text x="180" y="139" text-anchor="middle" font-size="8.5" fill="#555">freshness = update tolerance</text><line x1="180" y1="144" x2="180" y2="162" stroke="#555" stroke-width="1.5" marker-end="url(#ah)"/><rect x="115" y="168" width="130" height="24" rx="5" fill="#eeeeee" stroke="#888888" stroke-width="1.3"/><text x="180" y="183.5" text-anchor="middle" font-size="10" font-weight="normal" fill="#111">System API + DB</text><text x="180" y="227" text-anchor="middle" font-size="8.5" fill="#666">repeat reads served from cache;</text><text x="180" y="240" text-anchor="middle" font-size="8.5" fill="#666">backend load and latency drop</text><text x="392" y="54" font-size="12" font-weight="bold" fill="#111">Option B</text><rect x="388" y="60" width="312" height="222" rx="7" fill="#fbfdff" stroke="#aabbcc" stroke-width="1"/><rect x="479" y="72" width="130" height="24" rx="5" fill="#e8f0ff" stroke="#667788" stroke-width="1.3"/><text x="544" y="87.5" text-anchor="middle" font-size="10" font-weight="normal" fill="#111">Each request</text><line x1="544" y1="96" x2="544" y2="112" stroke="#555" stroke-width="1.5" marker-end="url(#ah)"/><rect x="459" y="116" width="170" height="28" rx="5" fill="#ffe8c7" stroke="#c77b2a" stroke-width="1.3"/><text x="544" y="126.5" text-anchor="middle" font-size="10" font-weight="bold" fill="#111">PERSIST TO AUDIT STORE</text><text x="544" y="139" text-anchor="middle" font-size="8.5" fill="#555">every request archived</text><line x1="544" y1="144" x2="544" y2="162" stroke="#555" stroke-width="1.5" marker-end="url(#ah)"/><rect x="479" y="168" width="130" height="24" rx="5" fill="#eeeeee" stroke="#888888" stroke-width="1.3"/><text x="544" y="183.5" text-anchor="middle" font-size="10" font-weight="normal" fill="#111">System API + DB</text><text x="544" y="227" text-anchor="middle" font-size="8.5" fill="#666">adds write cost, serves no</text><text x="544" y="240" text-anchor="middle" font-size="8.5" fill="#666">cached reads — latency unchanged</text><text x="28" y="294" font-size="12" font-weight="bold" fill="#111">Option C</text><rect x="24" y="300" width="312" height="222" rx="7" fill="#fbfdff" stroke="#aabbcc" stroke-width="1"/><rect x="115" y="312" width="130" height="24" rx="5" fill="#e8f0ff" stroke="#667788" stroke-width="1.3"/><text x="180" y="327.5" text-anchor="middle" font-size="10" font-weight="normal" fill="#111">GET /catalog</text><line x1="180" y1="336" x2="180" y2="352" stroke="#555" stroke-width="1.5" marker-end="url(#ah)"/><rect x="100" y="357" width="160" height="26" rx="5" fill="#ffe8c7" stroke="#c77b2a" stroke-width="1.3"/><text x="180" y="366.5" text-anchor="middle" font-size="10" font-weight="normal" fill="#111">NO CACHE — every call</text><text x="180" y="379" text-anchor="middle" font-size="8.5" fill="#555">straight to the backend</text><line x1="180" y1="383" x2="180" y2="401" stroke="#555" stroke-width="1.5" marker-end="url(#ah)"/><rect x="115" y="408" width="130" height="24" rx="5" fill="#eeeeee" stroke="#888888" stroke-width="1.3"/><text x="180" y="423.5" text-anchor="middle" font-size="10" font-weight="normal" fill="#111">System API + DB</text><text x="180" y="467" text-anchor="middle" font-size="8.5" fill="#666">the current problem, unchanged</text><text x="392" y="294" font-size="12" font-weight="bold" fill="#111">Option D</text><rect x="388" y="300" width="312" height="222" rx="7" fill="#fbfdff" stroke="#aabbcc" stroke-width="1"/><rect x="469" y="319" width="150" height="26" rx="5" fill="#ffe8c7" stroke="#c77b2a" stroke-width="1.3"/><text x="544" y="328.5" text-anchor="middle" font-size="10" font-weight="normal" fill="#111">Nightly email</text><text x="544" y="341" text-anchor="middle" font-size="8.5" fill="#555">catalog attached</text><line x1="544" y1="345" x2="544" y2="363" stroke="#555" stroke-width="1.5" marker-end="url(#ah)"/><rect x="474" y="369" width="140" height="26" rx="5" fill="#eeeeee" stroke="#888888" stroke-width="1.3"/><text x="544" y="385.5" text-anchor="middle" font-size="10" font-weight="normal" fill="#111">Consumers' inboxes</text><text x="544" y="442" text-anchor="middle" font-size="8.5" fill="#666">email is not an API: no contract,</text><text x="544" y="457" text-anchor="middle" font-size="8.5" fill="#666">no freshness, no error handling</text></svg>