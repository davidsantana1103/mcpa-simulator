<svg xmlns="http://www.w3.org/2000/svg" width="720" height="530" viewBox="0 0 720 530" font-family="Arial,sans-serif"><defs><marker id="ah" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#555"/></marker></defs><rect width="720" height="530" fill="#ffffff"/><text x="28" y="54" font-size="12" font-weight="bold" fill="#111">Option A</text><rect x="24" y="60" width="312" height="222" rx="7" fill="#fbfdff" stroke="#aabbcc" stroke-width="1"/><rect x="115" y="79" width="130" height="26" rx="5" fill="#e8f0ff" stroke="#667788" stroke-width="1.3"/><text x="180" y="95.5" text-anchor="middle" font-size="10" font-weight="bold" fill="#111">Mobile + web apps</text><line x1="180" y1="105" x2="180" y2="119" stroke="#555" stroke-width="1.5" marker-end="url(#ah)"/><rect x="105" y="123" width="150" height="28" rx="5" fill="#cfe2ff" stroke="#2a8fd8" stroke-width="1.3"/><text x="180" y="133.5" text-anchor="middle" font-size="10" font-weight="bold" fill="#111">WEB API (contract)</text><text x="180" y="146" text-anchor="middle" font-size="8.5" fill="#555">published HTTP interface</text><line x1="180" y1="151" x2="180" y2="165" stroke="#555" stroke-width="1.5" marker-end="url(#ah)"/><rect x="115" y="169" width="130" height="26" rx="5" fill="#eeeeee" stroke="#888888" stroke-width="1.3"/><text x="180" y="185.5" text-anchor="middle" font-size="10" font-weight="normal" fill="#111">Database backend</text><text x="180" y="227" text-anchor="middle" font-size="8.5" fill="#666">client → contract → implementation</text><text x="180" y="242" text-anchor="middle" font-size="8.5" fill="#666">backend stays encapsulated</text><text x="392" y="54" font-size="12" font-weight="bold" fill="#111">Option B</text><rect x="388" y="60" width="312" height="222" rx="7" fill="#fbfdff" stroke="#aabbcc" stroke-width="1"/><rect x="414" y="79" width="120" height="26" rx="5" fill="#e8f0ff" stroke="#667788" stroke-width="1.3"/><text x="474" y="95.5" text-anchor="middle" font-size="10" font-weight="normal" fill="#111">All apps</text><rect x="564" y="79" width="120" height="26" rx="5" fill="#eeeeee" stroke="#888888" stroke-width="1.3"/><text x="624" y="95.5" text-anchor="middle" font-size="10" font-weight="normal" fill="#111">Backend systems</text><rect x="444" y="137" width="200" height="30" rx="5" fill="#ffe8c7" stroke="#c77b2a" stroke-width="1.3"/><text x="544" y="148.5" text-anchor="middle" font-size="10" font-weight="bold" fill="#111">CENTRAL ESB BUS</text><text x="544" y="161" text-anchor="middle" font-size="8.5" fill="#555">one integration team</text><line x1="474" y1="105" x2="514" y2="137" stroke="#555" stroke-width="1.5" marker-end="url(#ah)"/><line x1="624" y1="105" x2="584" y2="137" stroke="#555" stroke-width="1.5" marker-end="url(#ah)"/><line x1="544" y1="167" x2="544" y2="185" stroke="#555" stroke-width="1.5" marker-end="url(#ah)"/><rect x="459" y="189" width="170" height="26" rx="5" fill="#eeeeee" stroke="#888888" stroke-width="1.3"/><text x="544" y="205.5" text-anchor="middle" font-size="10" font-weight="normal" fill="#111">No published contracts</text><text x="544" y="237" text-anchor="middle" font-size="8.5" fill="#666">every route owned centrally</text><text x="28" y="294" font-size="12" font-weight="bold" fill="#111">Option C</text><rect x="24" y="300" width="312" height="222" rx="7" fill="#fbfdff" stroke="#aabbcc" stroke-width="1"/><rect x="110" y="314" width="140" height="26" rx="5" fill="#ffe8c7" stroke="#c77b2a" stroke-width="1.3"/><text x="180" y="330.5" text-anchor="middle" font-size="10" font-weight="normal" fill="#111">Nightly CSV export</text><line x1="180" y1="340" x2="180" y2="354" stroke="#555" stroke-width="1.5" marker-end="url(#ah)"/><rect x="105" y="359" width="150" height="26" rx="5" fill="#eeeeee" stroke="#888888" stroke-width="1.3"/><text x="180" y="375.5" text-anchor="middle" font-size="10" font-weight="normal" fill="#111">Shared FTP folder</text><line x1="180" y1="385" x2="180" y2="399" stroke="#555" stroke-width="1.5" marker-end="url(#ah)"/><rect x="110" y="404" width="140" height="26" rx="5" fill="#e8f0ff" stroke="#667788" stroke-width="1.3"/><text x="180" y="420.5" text-anchor="middle" font-size="10" font-weight="normal" fill="#111">Apps poll the folder</text><text x="180" y="462" text-anchor="middle" font-size="8.5" fill="#666">batch files — no HTTP contract</text><text x="392" y="294" font-size="12" font-weight="bold" fill="#111">Option D</text><rect x="388" y="300" width="312" height="222" rx="7" fill="#fbfdff" stroke="#aabbcc" stroke-width="1"/><rect x="474" y="319" width="140" height="26" rx="5" fill="#e8f0ff" stroke="#667788" stroke-width="1.3"/><text x="544" y="335.5" text-anchor="middle" font-size="10" font-weight="normal" fill="#111">Client apps</text><line x1="544" y1="345" x2="544" y2="359" stroke="#555" stroke-width="1.5" marker-end="url(#ah)"/><rect x="464" y="363" width="160" height="28" rx="5" fill="#cfe2ff" stroke="#2a8fd8" stroke-width="1.3"/><text x="544" y="373.5" text-anchor="middle" font-size="10" font-weight="bold" fill="#111">JDBC DRIVER (embedded)</text><text x="544" y="386" text-anchor="middle" font-size="8.5" fill="#555">raw SQL in app code</text><line x1="544" y1="391" x2="544" y2="405" stroke="#555" stroke-width="1.5" marker-end="url(#ah)"/><rect x="479" y="409" width="130" height="26" rx="5" fill="#eeeeee" stroke="#888888" stroke-width="1.3"/><text x="544" y="425.5" text-anchor="middle" font-size="10" font-weight="normal" fill="#111">Database schema</text><text x="544" y="467" text-anchor="middle" font-size="8.5" fill="#666">apps coupled to physical schema</text></svg>