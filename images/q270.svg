<svg xmlns="http://www.w3.org/2000/svg" width="740" height="330" viewBox="0 0 740 330" font-family="Arial,sans-serif" font-size="13">
<rect width="740" height="330" fill="#fff"/>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#333"/></marker></defs>

<text x="20" y="28" font-size="15" font-weight="bold">External OpenID Connect identity provider + API portal client registration</text>

<rect x="20" y="60" width="120" height="60" rx="6" fill="#eee" stroke="#555"/>
<text x="80" y="85" text-anchor="middle">Client</text><text x="80" y="103" text-anchor="middle" font-size="11">application</text>

<rect x="185" y="55" width="130" height="70" rx="6" fill="#d6f5de" stroke="#3aa655"/>
<text x="250" y="80" text-anchor="middle">Anypoint</text><text x="250" y="97" text-anchor="middle">API portal</text><text x="250" y="114" text-anchor="middle" font-size="10">(dynamic DCR)</text>

<rect x="360" y="55" width="150" height="70" rx="6" fill="#fffbe8" stroke="#e8913a"/>
<text x="435" y="80" text-anchor="middle">External OIDC IdP</text>
<text x="435" y="97" text-anchor="middle" font-size="11">Okta / Salesforce /</text>
<text x="435" y="112" text-anchor="middle" font-size="11">OpenAM / PingFederate</text>

<rect x="555" y="55" width="165" height="70" rx="6" fill="#cfe2ff" stroke="#2a8fd8"/>
<text x="637" y="80" text-anchor="middle">API gateway</text><text x="637" y="97" text-anchor="middle" font-size="11">(policy enforced)</text>

<line x1="140" y1="90" x2="183" y2="90" stroke="#333" marker-end="url(#a)"/>
<line x1="315" y1="90" x2="358" y2="90" stroke="#333" marker-end="url(#a)"/>
<line x1="510" y1="90" x2="553" y2="90" stroke="#333" marker-end="url(#a)"/>
<text x="163" y="82" font-size="10" text-anchor="middle">request</text>
<text x="336" y="82" font-size="10" text-anchor="middle">register</text>
<text x="531" y="82" font-size="10" text-anchor="middle">token</text>

<rect x="20" y="165" width="700" height="145" rx="8" fill="#f3f7ff" stroke="#2a8fd8"/>
<text x="40" y="192" font-weight="bold">Policy validation flow</text>
<text x="40" y="216" font-size="12">1. Request reaches the API protected by the policy</text>
<text x="40" y="238" font-size="12">2. Policy extracts the token and sends it to the validation endpoint</text>
<text x="40" y="260" font-size="12">3. Validation endpoint returns token metadata, including the client ID</text>
<text x="40" y="282" font-size="12">4. Policy checks the client ID against contracts obtained from Anypoint Platform</text>
<text x="40" y="302" font-size="12" fill="#8a5a00">The policy validates tokens; it does not generate them.</text>
</svg>
