<svg xmlns="http://www.w3.org/2000/svg" width="720" height="530" viewBox="0 0 720 530" font-family="Arial,sans-serif"><defs><marker id="ah" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#555"/></marker></defs><rect width="720" height="530" fill="#ffffff"/><text x="28" y="54" font-size="12" font-weight="bold" fill="#111">Option A</text><rect x="24" y="60" width="312" height="222" rx="7" fill="#fbfdff" stroke="#aabbcc" stroke-width="1"/><rect x="95" y="70" width="170" height="28" rx="5" fill="#cfe2ff" stroke="#2a8fd8" stroke-width="1.3"/><text x="180" y="80.5" text-anchor="middle" font-size="10" font-weight="bold" fill="#111">ANYPOINT VPC</text><text x="180" y="93" text-anchor="middle" font-size="8.5" fill="#555">CIDR picked non-overlapping</text><line x1="140" y1="98" x2="110" y2="122" stroke="#555" stroke-width="1.5" marker-end="url(#ah)"/><line x1="220" y1="98" x2="250" y2="122" stroke="#555" stroke-width="1.5" marker-end="url(#ah)"/><rect x="50" y="129" width="120" height="26" rx="5" fill="#d6f5de" stroke="#3aa655" stroke-width="1.3"/><text x="110" y="138.5" text-anchor="middle" font-size="10" font-weight="normal" fill="#111">VPN → customer DC</text><text x="110" y="151" text-anchor="middle" font-size="8.5" fill="#555">10.0.0.0/8 in use</text><rect x="190" y="129" width="120" height="26" rx="5" fill="#d6f5de" stroke="#3aa655" stroke-width="1.3"/><text x="250" y="138.5" text-anchor="middle" font-size="10" font-weight="normal" fill="#111">Peering → AWS VPC</text><text x="250" y="151" text-anchor="middle" font-size="8.5" fill="#555">non-overlapping range</text><text x="180" y="202" text-anchor="middle" font-size="8.5" fill="#666">address space is fixed at creation —</text><text x="180" y="217" text-anchor="middle" font-size="8.5" fill="#666">plan it before creating</text><text x="392" y="54" font-size="12" font-weight="bold" fill="#111">Option B</text><rect x="388" y="60" width="312" height="222" rx="7" fill="#fbfdff" stroke="#aabbcc" stroke-width="1"/><rect x="459" y="78" width="170" height="28" rx="5" fill="#ffe8c7" stroke="#c77b2a" stroke-width="1.3"/><text x="544" y="88.5" text-anchor="middle" font-size="10" font-weight="bold" fill="#111">VPC created with any CIDR</text><text x="544" y="101" text-anchor="middle" font-size="8.5" fill="#555">even overlapping ranges</text><text x="544" y="162" text-anchor="middle" font-size="8.5" fill="#666">VPCs do NOT auto-resize;</text><text x="544" y="177" text-anchor="middle" font-size="8.5" fill="#666">overlaps break routing</text><text x="28" y="294" font-size="12" font-weight="bold" fill="#111">Option C</text><rect x="24" y="300" width="312" height="222" rx="7" fill="#fbfdff" stroke="#aabbcc" stroke-width="1"/><rect x="105" y="319" width="150" height="26" rx="5" fill="#eeeeee" stroke="#888888" stroke-width="1.3"/><text x="180" y="335.5" text-anchor="middle" font-size="10" font-weight="normal" fill="#111">Workers, public IPs only</text><line x1="180" y1="345" x2="180" y2="363" stroke="#555" stroke-width="1.5" marker-end="url(#ah)"/><rect x="100" y="369" width="160" height="26" rx="5" fill="#ffe8c7" stroke="#c77b2a" stroke-width="1.3"/><text x="180" y="378.5" text-anchor="middle" font-size="10" font-weight="normal" fill="#111">On-prem systems exposed</text><text x="180" y="391" text-anchor="middle" font-size="8.5" fill="#555">to the public internet</text><text x="180" y="442" text-anchor="middle" font-size="8.5" fill="#666">public exposure of internal</text><text x="180" y="457" text-anchor="middle" font-size="8.5" fill="#666">systems violates every policy</text><text x="392" y="294" font-size="12" font-weight="bold" fill="#111">Option D</text><rect x="388" y="300" width="312" height="222" rx="7" fill="#fbfdff" stroke="#aabbcc" stroke-width="1"/><rect x="459" y="318" width="170" height="28" rx="5" fill="#ffe8c7" stroke="#c77b2a" stroke-width="1.3"/><text x="544" y="328.5" text-anchor="middle" font-size="10" font-weight="bold" fill="#111">VPC CIDR = 10.0.0.0/8</text><text x="544" y="341" text-anchor="middle" font-size="8.5" fill="#555">identical to customer network</text><line x1="544" y1="346" x2="544" y2="364" stroke="#555" stroke-width="1.5" marker-end="url(#ah)"/><rect x="479" y="370" width="130" height="24" rx="5" fill="#eeeeee" stroke="#888888" stroke-width="1.3"/><text x="544" y="378.5" text-anchor="middle" font-size="10" font-weight="normal" fill="#111">Customer network</text><text x="544" y="391" text-anchor="middle" font-size="8.5" fill="#555">also 10.0.0.0/8</text><text x="544" y="442" text-anchor="middle" font-size="8.5" fill="#666">identical ranges cannot route —</text><text x="544" y="457" text-anchor="middle" font-size="8.5" fill="#666">VPN and peering both fail</text></svg>