<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" font-family="Arial,sans-serif">
<defs><marker id="ah" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#555"/></marker></defs>
<text x="30" y="36" text-anchor="start" font-size="11" fill="#111" font-weight="bold">Option A</text><rect x="25" y="44" width="310" height="192" rx="6" fill="#fafcff" stroke="#8899aa" stroke-width="1.2"/><text x="175" y="62" text-anchor="middle" font-size="10" fill="#111" font-weight="bold">Anypoint VPC</text><rect x="105" y="46" width="140" height="24" rx="4" fill="#cfe2ff" stroke="#2a8fd8" stroke-width="1.2"/><text x="175" y="100" text-anchor="middle" font-size="9" fill="#666" font-weight="normal">CIDR chosen NOT to</text><text x="175" y="114" text-anchor="middle" font-size="9" fill="#666" font-weight="normal">overlap customer nets</text><text x="175" y="138" text-anchor="middle" font-size="9" fill="#666" font-weight="normal">VPN tunnel + peering</text><text x="175" y="152" text-anchor="middle" font-size="9" fill="#666" font-weight="normal">planned at creation</text><text x="175" y="176" text-anchor="middle" font-size="9" fill="#666" font-weight="normal">address space fixed at</text><text x="175" y="190" text-anchor="middle" font-size="9" fill="#666" font-weight="normal">creation; plan it right</text><text x="390" y="36" text-anchor="start" font-size="11" fill="#111" font-weight="bold">Option B</text><rect x="385" y="44" width="310" height="192" rx="6" fill="#fafcff" stroke="#8899aa" stroke-width="1.2"/><text x="535" y="62" text-anchor="middle" font-size="10" fill="#111" font-weight="normal">Anypoint VPC</text><rect x="465" y="46" width="140" height="24" rx="4" fill="#cfe2ff" stroke="#2a8fd8" stroke-width="1.2"/><text x="535" y="100" text-anchor="middle" font-size="9" fill="#a33" font-weight="normal">auto-resizing</text><text x="535" y="114" text-anchor="middle" font-size="9" fill="#a33" font-weight="normal">CIDR on demand</text><text x="535" y="138" text-anchor="middle" font-size="9" fill="#666" font-weight="normal">(VPCs do not</text><text x="535" y="152" text-anchor="middle" font-size="9" fill="#666" font-weight="normal">auto-resize)</text><text x="30" y="286" text-anchor="start" font-size="11" fill="#111" font-weight="bold">Option C</text><rect x="25" y="294" width="310" height="192" rx="6" fill="#fafcff" stroke="#8899aa" stroke-width="1.2"/><text x="175" y="316" text-anchor="middle" font-size="9" fill="#111" font-weight="normal">workers on public</text><rect x="105" y="300" width="140" height="24" rx="4" fill="#eeeeee" stroke="#555" stroke-width="1.2"/><text x="175" y="344" text-anchor="middle" font-size="9" fill="#666" font-weight="normal">IPs, no VPC</text><text x="175" y="368" text-anchor="middle" font-size="9" fill="#666" font-weight="normal">public exposure of</text><text x="175" y="382" text-anchor="middle" font-size="9" fill="#666" font-weight="normal">backends required</text><text x="390" y="286" text-anchor="start" font-size="11" fill="#111" font-weight="bold">Option D</text><rect x="385" y="294" width="310" height="192" rx="6" fill="#fafcff" stroke="#8899aa" stroke-width="1.2"/><text x="535" y="316" text-anchor="middle" font-size="10" fill="#111" font-weight="normal">Anypoint VPC</text><rect x="465" y="300" width="140" height="24" rx="4" fill="#cfe2ff" stroke="#2a8fd8" stroke-width="1.2"/><text x="535" y="344" text-anchor="middle" font-size="9" fill="#a33" font-weight="normal">overlapping CIDR with</text><text x="535" y="358" text-anchor="middle" font-size="9" fill="#a33" font-weight="normal">the customer network</text><text x="535" y="382" text-anchor="middle" font-size="9" fill="#666" font-weight="normal">(routing conflict)</text></svg>
