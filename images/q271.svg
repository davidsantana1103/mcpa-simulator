<svg xmlns="http://www.w3.org/2000/svg" width="740" height="410" viewBox="0 0 740 410" font-family="Arial,sans-serif" font-size="13">
<rect width="740" height="410" fill="#fff"/>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#333"/></marker></defs>

<text x="20" y="28" font-size="15" font-weight="bold">CloudHub 2.0 private space — custom domain over HTTPS</text>

<rect x="20" y="55" width="120" height="60" rx="6" fill="#eee" stroke="#555"/>
<text x="80" y="80" text-anchor="middle">External client</text>
<text x="80" y="98" text-anchor="middle" font-size="11">https://api.company.com</text>

<rect x="190" y="45" width="170" height="80" rx="6" fill="#fffbe8" stroke="#e8913a"/>
<text x="275" y="70" text-anchor="middle">Corporate DNS</text>
<text x="275" y="88" text-anchor="middle" font-size="11">CNAME → private space</text>
<text x="275" y="104" text-anchor="middle" font-size="11">public DNS target</text>

<rect x="410" y="35" width="310" height="240" rx="10" fill="#f3f7ff" stroke="#2a8fd8"/>
<text x="565" y="58" text-anchor="middle" font-weight="bold">CloudHub 2.0 Private Space</text>

<rect x="430" y="75" width="270" height="45" rx="6" fill="#d6f5de" stroke="#3aa655"/>
<text x="565" y="95" text-anchor="middle">Managed ingress load balancer</text>
<text x="565" y="112" text-anchor="middle" font-size="11">ports 443 (and 80) — auto-scales</text>

<rect x="430" y="135" width="270" height="55" rx="6" fill="#cfe2ff" stroke="#555"/>
<text x="565" y="156" text-anchor="middle">TLS context (keystore)</text>
<text x="565" y="174" text-anchor="middle" font-size="11">CN / SAN: api.company.com</text>

<rect x="430" y="200" width="270" height="38" rx="6" fill="#fff2d9" stroke="#e8913a"/>
<text x="565" y="216" text-anchor="middle" font-size="11">App Ingress settings: external endpoint</text>
<text x="565" y="231" text-anchor="middle" font-size="11">api.company.com → app</text>

<rect x="455" y="248" width="220" height="34" rx="6" fill="#fff" stroke="#555"/>
<text x="565" y="263" text-anchor="middle">Mule app (replicas)</text>
<text x="565" y="277" text-anchor="middle" font-size="11">listens on 0.0.0.0 ${http.port}</text>

<line x1="140" y1="85" x2="188" y2="85" stroke="#333" marker-end="url(#a)"/>
<line x1="360" y1="85" x2="408" y2="85" stroke="#333" marker-end="url(#a)"/>
<line x1="565" y1="120" x2="565" y2="133" stroke="#333" marker-end="url(#a)"/>
<line x1="565" y1="190" x2="565" y2="198" stroke="#333" marker-end="url(#a)"/>
<line x1="565" y1="238" x2="565" y2="246" stroke="#333" marker-end="url(#a)"/>

<text x="20" y="150" font-size="12" fill="#8a5a00">Default TLS context for</text>
<text x="20" y="168" font-size="12" fill="#8a5a00">cloudhub.io cannot be removed.</text>
<text x="20" y="200" font-size="12">No Dedicated Load Balancer</text>
<text x="20" y="218" font-size="12">is created for a private space.</text>
</svg>
