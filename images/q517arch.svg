<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" font-family="Arial,sans-serif">
<defs><marker id="ah" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#555"/></marker></defs>
<text x="30" y="36" text-anchor="start" font-size="11" fill="#111" font-weight="bold">Option A</text><rect x="25" y="44" width="310" height="192" rx="6" fill="#fafcff" stroke="#8899aa" stroke-width="1.2"/><text x="175" y="56" text-anchor="middle" font-size="9" fill="#111" font-weight="normal">App with 2 workers</text><rect x="95" y="60" width="160" height="20" rx="4" fill="#e8f0ff" stroke="#555" stroke-width="1.2"/><text x="105" y="90" text-anchor="middle" font-size="9" fill="#111" font-weight="normal">worker 1</text><rect x="65" y="94" width="80" height="18" rx="4" fill="#cfe2ff" stroke="#2a8fd8" stroke-width="1.2"/><text x="245" y="90" text-anchor="middle" font-size="9" fill="#111" font-weight="normal">worker 2</text><rect x="205" y="94" width="80" height="18" rx="4" fill="#cfe2ff" stroke="#2a8fd8" stroke-width="1.2"/><text x="105" y="118" text-anchor="middle" font-size="8" fill="#666" font-weight="normal">DC-East</text><text x="245" y="118" text-anchor="middle" font-size="8" fill="#666" font-weight="normal">DC-West</text><text x="175" y="142" text-anchor="middle" font-size="9" fill="#666" font-weight="normal">spread across data</text><text x="175" y="156" text-anchor="middle" font-size="9" fill="#666" font-weight="normal">centers by default</text><text x="175" y="180" text-anchor="middle" font-size="9" fill="#666" font-weight="normal">one DC fails, one</text><text x="175" y="194" text-anchor="middle" font-size="9" fill="#666" font-weight="normal">worker keeps serving</text><text x="390" y="36" text-anchor="start" font-size="11" fill="#111" font-weight="bold">Option B</text><rect x="385" y="44" width="310" height="192" rx="6" fill="#fafcff" stroke="#8899aa" stroke-width="1.2"/><text x="535" y="56" text-anchor="middle" font-size="9" fill="#111" font-weight="normal">App 1 worker</text><rect x="480" y="60" width="110" height="20" rx="4" fill="#ffe8c7" stroke="#c77b2a" stroke-width="1.2"/><text x="535" y="90" text-anchor="middle" font-size="9" fill="#a33" font-weight="normal">auto hot standby</text><text x="535" y="104" text-anchor="middle" font-size="9" fill="#666" font-weight="normal">(no such feature)</text><text x="535" y="128" text-anchor="middle" font-size="9" fill="#666" font-weight="normal">single worker = SPOF</text><text x="30" y="286" text-anchor="start" font-size="11" fill="#111" font-weight="bold">Option C</text><rect x="25" y="294" width="310" height="192" rx="6" fill="#fafcff" stroke="#8899aa" stroke-width="1.2"/><text x="175" y="316" text-anchor="middle" font-size="9" fill="#111" font-weight="normal">auto cross-region</text><rect x="105" y="320" width="140" height="20" rx="4" fill="#eeeeee" stroke="#555" stroke-width="1.2"/><text x="175" y="350" text-anchor="middle" font-size="9" fill="#666" font-weight="normal">failover without</text><text x="175" y="364" text-anchor="middle" font-size="9" fill="#666" font-weight="normal">customer design</text><text x="175" y="388" text-anchor="middle" font-size="9" fill="#666" font-weight="normal">(not provided)</text><text x="390" y="286" text-anchor="start" font-size="11" fill="#111" font-weight="bold">Option D</text><rect x="385" y="294" width="310" height="192" rx="6" fill="#fafcff" stroke="#8899aa" stroke-width="1.2"/><text x="535" y="316" text-anchor="middle" font-size="9" fill="#111" font-weight="normal">one big 4.0-vCore</text><rect x="465" y="320" width="140" height="20" rx="4" fill="#cfe2ff" stroke="#2a8fd8" stroke-width="1.2"/><text x="535" y="350" text-anchor="middle" font-size="9" fill="#111" font-weight="normal">worker</text><rect x="505" y="344" width="60" height="18" rx="4" fill="#cfe2ff" stroke="#2a8fd8" stroke-width="1.2"/><text x="535" y="378" text-anchor="middle" font-size="9" fill="#666" font-weight="normal">still one DC, one</text><text x="535" y="392" text-anchor="middle" font-size="9" fill="#666" font-weight="normal">point of failure</text></svg>
