<svg xmlns="http://www.w3.org/2000/svg" width="720" height="530" viewBox="0 0 720 530" font-family="Arial,sans-serif"><defs><marker id="ah" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#555"/></marker></defs><rect width="720" height="530" fill="#ffffff"/><text x="28" y="54" font-size="12" font-weight="bold" fill="#111">Option A</text><rect x="24" y="60" width="312" height="222" rx="7" fill="#fbfdff" stroke="#aabbcc" stroke-width="1"/><rect x="55" y="75" width="110" height="34" rx="5" fill="#cfe2ff" stroke="#2a8fd8" stroke-width="1.3"/><text x="110" y="88.5" text-anchor="middle" font-size="10" font-weight="bold" fill="#111">WORKER 1</text><text x="110" y="101" text-anchor="middle" font-size="8.5" fill="#555">data center East</text><rect x="195" y="75" width="110" height="34" rx="5" fill="#cfe2ff" stroke="#2a8fd8" stroke-width="1.3"/><text x="250" y="88.5" text-anchor="middle" font-size="10" font-weight="bold" fill="#111">WORKER 2</text><text x="250" y="101" text-anchor="middle" font-size="8.5" fill="#555">data center West</text><rect x="85" y="152" width="190" height="20" rx="4" fill="none" stroke="#3aa655" stroke-dasharray="4,3" stroke-width="1.2"/><text x="180" y="165" text-anchor="middle" font-size="8.5" fill="#3aa655">one app, two workers</text><text x="180" y="202" text-anchor="middle" font-size="8.5" fill="#666">CloudHub spreads workers across DCs</text><text x="180" y="217" text-anchor="middle" font-size="8.5" fill="#666">one DC fails → other serves</text><text x="392" y="54" font-size="12" font-weight="bold" fill="#111">Option B</text><rect x="388" y="60" width="312" height="222" rx="7" fill="#fbfdff" stroke="#aabbcc" stroke-width="1"/><rect x="469" y="79" width="150" height="26" rx="5" fill="#ffe8c7" stroke="#c77b2a" stroke-width="1.3"/><text x="544" y="95.5" text-anchor="middle" font-size="10" font-weight="normal" fill="#111">WORKER (single)</text><line x1="544" y1="105" x2="544" y2="123" stroke="#555" stroke-width="1.5" marker-end="url(#ah)"/><rect x="469" y="124" width="150" height="26" rx="5" fill="#eeeeee" stroke="#888888" stroke-width="1.3"/><text x="544" y="133.5" text-anchor="middle" font-size="10" font-weight="normal" fill="#111">phantom hot standby</text><text x="544" y="146" text-anchor="middle" font-size="8.5" fill="#555">(does not exist)</text><text x="544" y="197" text-anchor="middle" font-size="8.5" fill="#666">no hot-standby feature exists;</text><text x="544" y="212" text-anchor="middle" font-size="8.5" fill="#666">single worker = single point of failure</text><text x="28" y="294" font-size="12" font-weight="bold" fill="#111">Option C</text><rect x="24" y="300" width="312" height="222" rx="7" fill="#fbfdff" stroke="#aabbcc" stroke-width="1"/><rect x="105" y="319" width="150" height="26" rx="5" fill="#ffe8c7" stroke="#c77b2a" stroke-width="1.3"/><text x="180" y="335.5" text-anchor="middle" font-size="10" font-weight="normal" fill="#111">App in one region</text><line x1="180" y1="345" x2="180" y2="363" stroke="#555" stroke-width="1.5" marker-end="url(#ah)"/><rect x="100" y="364" width="160" height="26" rx="5" fill="#eeeeee" stroke="#888888" stroke-width="1.3"/><text x="180" y="373.5" text-anchor="middle" font-size="10" font-weight="normal" fill="#111">auto cross-region failover</text><text x="180" y="386" text-anchor="middle" font-size="8.5" fill="#555">(not provided)</text><text x="180" y="437" text-anchor="middle" font-size="8.5" fill="#666">cross-region failover requires</text><text x="180" y="452" text-anchor="middle" font-size="8.5" fill="#666">deliberate customer design</text><text x="392" y="294" font-size="12" font-weight="bold" fill="#111">Option D</text><rect x="388" y="300" width="312" height="222" rx="7" fill="#fbfdff" stroke="#aabbcc" stroke-width="1"/><rect x="459" y="315" width="170" height="34" rx="5" fill="#ffe8c7" stroke="#c77b2a" stroke-width="1.3"/><text x="544" y="328.5" text-anchor="middle" font-size="10" font-weight="bold" fill="#111">ONE 4.0-vCORE WORKER</text><text x="544" y="341" text-anchor="middle" font-size="8.5" fill="#555">maximum size</text><text x="544" y="407" text-anchor="middle" font-size="8.5" fill="#666">one worker, however big, sits</text><text x="544" y="422" text-anchor="middle" font-size="8.5" fill="#666">in one data center</text><text x="544" y="457" text-anchor="middle" font-size="8.5" fill="#666">size ≠ redundancy</text></svg>