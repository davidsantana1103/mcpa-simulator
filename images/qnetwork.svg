<svg xmlns="http://www.w3.org/2000/svg" width="600" height="280" viewBox="0 0 600 280" font-family="Arial, sans-serif" font-size="12">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>
  <text x="300" y="22" text-anchor="middle" font-size="13" font-weight="bold">API-Led Order Flow</text>

  <rect x="30" y="60" width="150" height="50" rx="8" fill="#e8f4ff" stroke="#4a7bbf" stroke-width="2"/>
  <text x="105" y="80" text-anchor="middle" font-weight="bold">Mobile App</text>
  <text x="105" y="97" text-anchor="middle">(API client)</text>

  <rect x="230" y="60" width="150" height="50" rx="8" fill="#fff" stroke="#2a8f4a" stroke-width="2"/>
  <text x="305" y="80" text-anchor="middle" font-weight="bold">Checkout</text>
  <text x="305" y="97" text-anchor="middle">Experience API</text>

  <rect x="430" y="60" width="150" height="50" rx="8" fill="#fff4e0" stroke="#c77b2a" stroke-width="2"/>
  <text x="505" y="80" text-anchor="middle" font-weight="bold">Order Process</text>
  <text x="505" y="97" text-anchor="middle">Process API</text>

  <line x1="180" y1="85" x2="230" y2="85" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="380" y1="85" x2="430" y2="85" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="150" y="190" width="130" height="50" rx="8" fill="#f0f0f0" stroke="#666" stroke-width="2"/>
  <text x="215" y="210" text-anchor="middle" font-weight="bold">SAP Orders</text>
  <text x="215" y="227" text-anchor="middle">System API</text>

  <rect x="320" y="190" width="130" height="50" rx="8" fill="#f0f0f0" stroke="#666" stroke-width="2"/>
  <text x="385" y="210" text-anchor="middle" font-weight="bold">Inventory</text>
  <text x="385" y="227" text-anchor="middle">System API</text>

  <line x1="480" y1="110" x2="400" y2="188" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="450" y1="120" x2="280" y2="188" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>

  <text x="300" y="262" text-anchor="middle" fill="#888">arrows show the direction of invocation</text>
</svg>