<svg xmlns="http://www.w3.org/2000/svg" width="740" height="370" viewBox="0 0 740 370" font-family="Arial,sans-serif" font-size="13">
<rect width="740" height="370" fill="#fff"/>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#333"/></marker></defs>

<text x="20" y="26" font-size="15" font-weight="bold">Alternative A — Central gateway (north-south)</text>
<rect x="20" y="40" width="330" height="150" rx="8" fill="#f3f7ff" stroke="#2a8fd8"/>
<rect x="45" y="70" width="90" height="50" fill="#d6f5de" stroke="#555"/><text x="90" y="90" text-anchor="middle" font-size="12">Gateway</text><text x="90" y="107" text-anchor="middle" font-size="10">(in front)</text>
<rect x="180" y="55" width="150" height="110" rx="6" fill="#fff" stroke="#888" stroke-dasharray="4"/>
<text x="255" y="75" text-anchor="middle" font-size="11">Kubernetes cluster</text>
<rect x="195" y="88" width="55" height="30" fill="#eee" stroke="#555"/><text x="222" y="107" text-anchor="middle" font-size="10">svc1</text>
<rect x="260" y="88" width="55" height="30" fill="#eee" stroke="#555"/><text x="287" y="107" text-anchor="middle" font-size="10">svc2</text>
<rect x="195" y="126" width="55" height="30" fill="#eee" stroke="#555"/><text x="222" y="145" text-anchor="middle" font-size="10">svc3</text>
<rect x="260" y="126" width="55" height="30" fill="#eee" stroke="#555"/><text x="287" y="145" text-anchor="middle" font-size="10">svc4</text>
<line x1="135" y1="95" x2="178" y2="95" stroke="#333" marker-end="url(#a)"/>
<text x="185" y="185" font-size="10" fill="#8a5a00">Does not see all pod-to-pod (east-west) calls</text>

<text x="380" y="26" font-size="15" font-weight="bold">Alternative B — Service mesh (east-west)</text>
<rect x="380" y="40" width="340" height="150" rx="8" fill="#f3fff5" stroke="#3aa655"/>
<rect x="400" y="52" width="300" height="120" rx="6" fill="#fff" stroke="#888" stroke-dasharray="4"/>
<text x="550" y="70" text-anchor="middle" font-size="11">Istio service mesh</text>
<rect x="415" y="85" width="80" height="45" fill="#d6f5de" stroke="#555"/><text x="455" y="103" text-anchor="middle" font-size="10">svc + Envoy</text><text x="455" y="118" text-anchor="middle" font-size="10">sidecar</text>
<rect x="510" y="85" width="80" height="45" fill="#d6f5de" stroke="#555"/><text x="550" y="103" text-anchor="middle" font-size="10">svc + Envoy</text><text x="550" y="118" text-anchor="middle" font-size="10">sidecar</text>
<rect x="605" y="85" width="80" height="45" fill="#fffbe8" stroke="#e8913a"/><text x="645" y="103" text-anchor="middle" font-size="10">Mule</text><text x="645" y="118" text-anchor="middle" font-size="10">adapter</text>
<line x1="495" y1="107" x2="508" y2="107" stroke="#333" marker-end="url(#a)"/>
<line x1="590" y1="107" x2="603" y2="107" stroke="#333" marker-end="url(#a)"/>
<text x="550" y="155" text-anchor="middle" font-size="10">Sidecars enforce policies on service-to-service traffic</text>

<rect x="20" y="210" width="700" height="140" rx="8" fill="#fffbe8" stroke="#e8913a"/>
<text x="40" y="236" font-weight="bold">Requirement</text>
<text x="40" y="258" font-size="12">• Apply policies to Mule and non-Mule microservices</text>
<text x="40" y="280" font-size="12">• Govern service-to-service (east-west) traffic inside the cluster</text>
<text x="40" y="302" font-size="12">• Discover existing services as APIs in Anypoint Platform</text>
<text x="40" y="324" font-size="12">• Manage and secure everything from one control plane</text>
</svg>
