<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" font-family="Arial,sans-serif">
<defs><marker id="ah" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#555"/></marker></defs>
<text x="30" y="36" text-anchor="start" font-size="11" fill="#111" font-weight="bold">Option A</text><rect x="25" y="44" width="310" height="192" rx="6" fill="#fafcff" stroke="#8899aa" stroke-width="1.2"/><text x="175" y="56" text-anchor="middle" font-size="10" fill="#111" font-weight="normal">Client</text><rect x="140" y="60" width="70" height="20" rx="4" fill="#e8f0ff" stroke="#555" stroke-width="1.2"/><text x="175" y="90" text-anchor="middle" font-size="9" fill="#111" font-weight="bold">Authorization: Basic</text><rect x="90" y="84" width="170" height="20" rx="4" fill="#d6f5de" stroke="#3aa655" stroke-width="1.2"/><text x="175" y="124" text-anchor="middle" font-size="9" fill="#666" font-weight="normal">client_id + secret</text><line x1="175" y1="82" x2="175" y2="82" stroke="#555" stroke-width="1.4" marker-end="url(#ah)"/><text x="175" y="152" text-anchor="middle" font-size="9" fill="#666" font-weight="normal">header-based credentials;</text><text x="175" y="166" text-anchor="middle" font-size="9" fill="#666" font-weight="normal">configurable placement</text><text x="175" y="190" text-anchor="middle" font-size="9" fill="#666" font-weight="normal">no spec change needed</text><text x="175" y="204" text-anchor="middle" font-size="9" fill="#666" font-weight="normal">beyond documenting auth</text><text x="390" y="36" text-anchor="start" font-size="11" fill="#111" font-weight="bold">Option B</text><rect x="385" y="44" width="310" height="192" rx="6" fill="#fafcff" stroke="#8899aa" stroke-width="1.2"/><text x="535" y="56" text-anchor="middle" font-size="10" fill="#111" font-weight="normal">Client</text><rect x="500" y="60" width="70" height="20" rx="4" fill="#e8f0ff" stroke="#555" stroke-width="1.2"/><text x="535" y="90" text-anchor="middle" font-size="9" fill="#111" font-weight="normal">JSON body credential</text><rect x="455" y="84" width="160" height="20" rx="4" fill="#ffe8c7" stroke="#c77b2a" stroke-width="1.2"/><text x="535" y="124" text-anchor="middle" font-size="9" fill="#666" font-weight="normal">must be re-issued</text><text x="535" y="152" text-anchor="middle" font-size="9" fill="#666" font-weight="normal">credentials in bodies;</text><text x="535" y="166" text-anchor="middle" font-size="9" fill="#666" font-weight="normal">not the standard mode</text><text x="30" y="286" text-anchor="start" font-size="11" fill="#111" font-weight="bold">Option C</text><rect x="25" y="294" width="310" height="192" rx="6" fill="#fafcff" stroke="#8899aa" stroke-width="1.2"/><text x="175" y="316" text-anchor="middle" font-size="10" fill="#111" font-weight="normal">Client</text><rect x="140" y="320" width="70" height="20" rx="4" fill="#e8f0ff" stroke="#555" stroke-width="1.2"/><text x="175" y="350" text-anchor="middle" font-size="9" fill="#111" font-weight="normal">?client_id= in URL</text><rect x="100" y="344" width="150" height="20" rx="4" fill="#eeeeee" stroke="#555" stroke-width="1.2"/><text x="175" y="378" text-anchor="middle" font-size="9" fill="#666" font-weight="normal">query strings leak</text><text x="175" y="392" text-anchor="middle" font-size="9" fill="#666" font-weight="normal">into logs</text><text x="390" y="286" text-anchor="start" font-size="11" fill="#111" font-weight="bold">Option D</text><rect x="385" y="294" width="310" height="192" rx="6" fill="#fafcff" stroke="#8899aa" stroke-width="1.2"/><text x="535" y="316" text-anchor="middle" font-size="10" fill="#111" font-weight="normal">Client</text><rect x="500" y="320" width="70" height="20" rx="4" fill="#e8f0ff" stroke="#555" stroke-width="1.2"/><text x="535" y="350" text-anchor="middle" font-size="9" fill="#111" font-weight="normal">IP-inferred identity</text><rect x="465" y="344" width="140" height="20" rx="4" fill="#cfe2ff" stroke="#2a8fd8" stroke-width="1.2"/><text x="535" y="378" text-anchor="middle" font-size="9" fill="#666" font-weight="normal">IPs are not client</text><text x="535" y="392" text-anchor="middle" font-size="9" fill="#666" font-weight="normal">identity</text></svg>
