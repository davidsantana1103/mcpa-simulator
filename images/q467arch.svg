<svg xmlns="http://www.w3.org/2000/svg" width="720" height="530" viewBox="0 0 720 530" font-family="Arial,sans-serif"><defs><marker id="ah" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#555"/></marker></defs><rect width="720" height="530" fill="#ffffff"/><text x="28" y="54" font-size="12" font-weight="bold" fill="#111">Option A</text><rect x="24" y="60" width="312" height="222" rx="7" fill="#fbfdff" stroke="#aabbcc" stroke-width="1"/><rect x="120" y="72" width="120" height="24" rx="5" fill="#e8f0ff" stroke="#667788" stroke-width="1.3"/><text x="180" y="87.5" text-anchor="middle" font-size="10" font-weight="normal" fill="#111">Client app</text><line x1="180" y1="96" x2="180" y2="112" stroke="#555" stroke-width="1.5" marker-end="url(#ah)"/><rect x="85" y="116" width="190" height="28" rx="5" fill="#d6f5de" stroke="#3aa655" stroke-width="1.3"/><text x="180" y="126.5" text-anchor="middle" font-size="10" font-weight="bold" fill="#111">Authorization: Basic header</text><text x="180" y="139" text-anchor="middle" font-size="8.5" fill="#555">client_id + client_secret</text><line x1="180" y1="144" x2="180" y2="162" stroke="#555" stroke-width="1.5" marker-end="url(#ah)"/><rect x="100" y="167" width="160" height="26" rx="5" fill="#cfe2ff" stroke="#2a8fd8" stroke-width="1.3"/><text x="180" y="176.5" text-anchor="middle" font-size="10" font-weight="normal" fill="#111">Policy validates pair</text><text x="180" y="189" text-anchor="middle" font-size="8.5" fill="#555">against registered client</text><text x="180" y="230" text-anchor="middle" font-size="8.5" fill="#666">standard, configurable placement</text><text x="392" y="54" font-size="12" font-weight="bold" fill="#111">Option B</text><rect x="388" y="60" width="312" height="222" rx="7" fill="#fbfdff" stroke="#aabbcc" stroke-width="1"/><rect x="484" y="72" width="120" height="24" rx="5" fill="#e8f0ff" stroke="#667788" stroke-width="1.3"/><text x="544" y="87.5" text-anchor="middle" font-size="10" font-weight="normal" fill="#111">Client app</text><line x1="544" y1="96" x2="544" y2="112" stroke="#555" stroke-width="1.5" marker-end="url(#ah)"/><rect x="454" y="116" width="180" height="28" rx="5" fill="#ffe8c7" stroke="#c77b2a" stroke-width="1.3"/><text x="544" y="126.5" text-anchor="middle" font-size="10" font-weight="bold" fill="#111">Credentials in JSON body</text><text x="544" y="139" text-anchor="middle" font-size="8.5" fill="#555">policy must parse every body</text><text x="544" y="182" text-anchor="middle" font-size="8.5" fill="#666">bodies are not a standard</text><text x="544" y="197" text-anchor="middle" font-size="8.5" fill="#666">credential channel</text><text x="28" y="294" font-size="12" font-weight="bold" fill="#111">Option C</text><rect x="24" y="300" width="312" height="222" rx="7" fill="#fbfdff" stroke="#aabbcc" stroke-width="1"/><rect x="120" y="312" width="120" height="24" rx="5" fill="#e8f0ff" stroke="#667788" stroke-width="1.3"/><text x="180" y="327.5" text-anchor="middle" font-size="10" font-weight="normal" fill="#111">Client app</text><line x1="180" y1="336" x2="180" y2="352" stroke="#555" stroke-width="1.5" marker-end="url(#ah)"/><rect x="90" y="356" width="180" height="28" rx="5" fill="#ffe8c7" stroke="#c77b2a" stroke-width="1.3"/><text x="180" y="366.5" text-anchor="middle" font-size="10" font-weight="bold" fill="#111">?client_id= in URL query</text><text x="180" y="379" text-anchor="middle" font-size="8.5" fill="#555">visible in access logs</text><text x="180" y="422" text-anchor="middle" font-size="8.5" fill="#666">secrets leak into logs, proxies,</text><text x="180" y="437" text-anchor="middle" font-size="8.5" fill="#666">and browser history</text><text x="392" y="294" font-size="12" font-weight="bold" fill="#111">Option D</text><rect x="388" y="300" width="312" height="222" rx="7" fill="#fbfdff" stroke="#aabbcc" stroke-width="1"/><rect x="484" y="312" width="120" height="24" rx="5" fill="#e8f0ff" stroke="#667788" stroke-width="1.3"/><text x="544" y="327.5" text-anchor="middle" font-size="10" font-weight="normal" fill="#111">Client app</text><line x1="544" y1="336" x2="544" y2="352" stroke="#555" stroke-width="1.5" marker-end="url(#ah)"/><rect x="459" y="356" width="170" height="28" rx="5" fill="#ffe8c7" stroke="#c77b2a" stroke-width="1.3"/><text x="544" y="366.5" text-anchor="middle" font-size="10" font-weight="bold" fill="#111">IP-inferred identity</text><text x="544" y="379" text-anchor="middle" font-size="8.5" fill="#555">no credentials sent at all</text><text x="544" y="422" text-anchor="middle" font-size="8.5" fill="#666">IPs are not client identity —</text><text x="544" y="437" text-anchor="middle" font-size="8.5" fill="#666">shared NATs break it completely</text></svg>