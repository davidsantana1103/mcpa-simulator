<svg xmlns="http://www.w3.org/2000/svg" width="720" height="530" viewBox="0 0 720 530" font-family="Arial,sans-serif"><defs><marker id="ah" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#555"/></marker></defs><rect width="720" height="530" fill="#ffffff"/><text x="28" y="54" font-size="12" font-weight="bold" fill="#111">Option A</text><rect x="24" y="60" width="312" height="222" rx="7" fill="#fbfdff" stroke="#aabbcc" stroke-width="1"/><rect x="105" y="72" width="150" height="24" rx="5" fill="#ffe8c7" stroke="#c77b2a" stroke-width="1.3"/><text x="180" y="87.5" text-anchor="middle" font-size="10" font-weight="normal" fill="#111">Custom policy</text><line x1="180" y1="96" x2="180" y2="112" stroke="#555" stroke-width="1.5" marker-end="url(#ah)"/><rect x="95" y="115" width="170" height="26" rx="5" fill="#cfe2ff" stroke="#2a8fd8" stroke-width="1.3"/><text x="180" y="124.5" text-anchor="middle" font-size="10" font-weight="bold" fill="#111">EXCHANGE ASSET</text><text x="180" y="137" text-anchor="middle" font-size="8.5" fill="#555">versioned in business group</text><line x1="180" y1="141" x2="180" y2="159" stroke="#555" stroke-width="1.5" marker-end="url(#ah)"/><rect x="95" y="161" width="170" height="26" rx="5" fill="#d6f5de" stroke="#3aa655" stroke-width="1.3"/><text x="180" y="170.5" text-anchor="middle" font-size="10" font-weight="normal" fill="#111">API Manager catalog</text><text x="180" y="183" text-anchor="middle" font-size="8.5" fill="#555">owners apply per instance</text><text x="180" y="222" text-anchor="middle" font-size="8.5" fill="#666">versioned, discoverable, updatable</text><text x="392" y="54" font-size="12" font-weight="bold" fill="#111">Option B</text><rect x="388" y="60" width="312" height="222" rx="7" fill="#fbfdff" stroke="#aabbcc" stroke-width="1"/><rect x="479" y="72" width="130" height="24" rx="5" fill="#ffe8c7" stroke="#c77b2a" stroke-width="1.3"/><text x="544" y="87.5" text-anchor="middle" font-size="10" font-weight="normal" fill="#111">Policy JAR</text><line x1="544" y1="96" x2="544" y2="112" stroke="#555" stroke-width="1.5" marker-end="url(#ah)"/><rect x="479" y="116" width="130" height="24" rx="5" fill="#eeeeee" stroke="#888888" stroke-width="1.3"/><text x="544" y="131.5" text-anchor="middle" font-size="10" font-weight="normal" fill="#111">Email attachment</text><line x1="544" y1="140" x2="544" y2="156" stroke="#555" stroke-width="1.5" marker-end="url(#ah)"/><rect x="469" y="160" width="150" height="24" rx="5" fill="#e8f0ff" stroke="#667788" stroke-width="1.3"/><text x="544" y="175.5" text-anchor="middle" font-size="10" font-weight="normal" fill="#111">Each owner attaches</text><text x="544" y="217" text-anchor="middle" font-size="8.5" fill="#666">no versions, no updates, no audit</text><text x="28" y="294" font-size="12" font-weight="bold" fill="#111">Option C</text><rect x="24" y="300" width="312" height="222" rx="7" fill="#fbfdff" stroke="#aabbcc" stroke-width="1"/><rect x="105" y="312" width="150" height="24" rx="5" fill="#ffe8c7" stroke="#c77b2a" stroke-width="1.3"/><text x="180" y="327.5" text-anchor="middle" font-size="10" font-weight="normal" fill="#111">Custom policy</text><line x1="180" y1="336" x2="180" y2="352" stroke="#555" stroke-width="1.5" marker-end="url(#ah)"/><rect x="90" y="355" width="180" height="26" rx="5" fill="#ffe8c7" stroke="#c77b2a" stroke-width="1.3"/><text x="180" y="364.5" text-anchor="middle" font-size="10" font-weight="bold" fill="#111">EXCHANGE (root org only)</text><text x="180" y="377" text-anchor="middle" font-size="8.5" fill="#555">not shared to business groups</text><text x="180" y="422" text-anchor="middle" font-size="8.5" fill="#666">other groups cannot see it —</text><text x="180" y="437" text-anchor="middle" font-size="8.5" fill="#666">blocks the owners who need it</text><text x="392" y="294" font-size="12" font-weight="bold" fill="#111">Option D</text><rect x="388" y="300" width="312" height="222" rx="7" fill="#fbfdff" stroke="#aabbcc" stroke-width="1"/><rect x="464" y="312" width="160" height="24" rx="5" fill="#ffe8c7" stroke="#c77b2a" stroke-width="1.3"/><text x="544" y="327.5" text-anchor="middle" font-size="10" font-weight="normal" fill="#111">Each Mule app rebuilt</text><line x1="544" y1="336" x2="544" y2="352" stroke="#555" stroke-width="1.5" marker-end="url(#ah)"/><rect x="459" y="355" width="170" height="26" rx="5" fill="#eeeeee" stroke="#888888" stroke-width="1.3"/><text x="544" y="364.5" text-anchor="middle" font-size="10" font-weight="bold" fill="#111">POLICY CODE COMPILED IN</text><text x="544" y="377" text-anchor="middle" font-size="8.5" fill="#555">inside app flows</text><text x="544" y="422" text-anchor="middle" font-size="8.5" fill="#666">not a policy: cannot be applied</text><text x="544" y="437" text-anchor="middle" font-size="8.5" fill="#666">per instance from API Manager</text></svg>